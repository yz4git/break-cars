name: BREAK CARS Live Loop Visual Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/live-loop-visual-audit.mjs"
      - ".github/workflows/live-loop-visual-audit.yml"
      - "scripts/prepare-pages.py"
      - "scripts/apply-extreme-courses.py"
      - "scripts/fix-racing3d-projection.py"
      - "scripts/polish-reference-loop-geometry-v8.py"
      - "scripts/polish-course-specific-loop-geometry-v9.py"
      - "scripts/polish-rampage-reference-loop-v10.py"
      - "scripts/polish-rampage-reference-loop-v11.py"
      - "scripts/polish-rampage-parallel-loop-v12.py"
      - "scripts/tune-rampage-omega-entry-v13.py"
      - "scripts/add-rampage-live-audit-start-v14.py"
      - "scripts/polish-rampage-omega-camera-v15.py"
      - "scripts/polish-rampage-omega-camera-v16.py"
      - "scripts/polish-rampage-omega-camera-v17.py"
      - "scripts/polish-rampage-omega-camera-v18.py"
      - "scripts/polish-rampage-omega-hud-v19.py"
      - "scripts/polish-rampage-opening-toast-v20.py"
      - "scripts/fix-racing3d-speedometer-v1.py"
      - "scripts/tune-double-orbit-pack-v7.py"
      - "scripts/stabilize-double-orbit-final-jump-v8.py"
      - "scripts/boost-rampage-loop-v6.py"
      - "scripts/test-natural-loop-connection.mjs"
      - "scripts/test-player-auto-upright.mjs"
      - "dist/racing3d.js"
      - "dist/track-view.js"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for this exact Pages build
        run: |
          set -euo pipefail
          want="${GITHUB_SHA:0:12}"
          for i in $(seq 1 36); do
            got="$(curl -fsSL "https://yz4git.github.io/break-cars/build-id.txt?audit=${GITHUB_SHA}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            echo "Pages build: ${got:-missing}; want: $want"
            if [ "$got" = "$want" ]; then exit 0; fi
            sleep 10
          done
          echo "Timed out waiting for exact Pages build" >&2
          exit 1
      - name: Capture real WebGL gameplay
        env:
          BREAK_CARS_AUDIT_URL: https://yz4git.github.io/break-cars/
        run: node .github/live-loop-visual-audit.mjs
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: break-cars-live-loop-${{ github.sha }}
          path: artifacts/live-loop-visual-audit
          if-no-files-found: error
          retention-days: 7
      - name: Publish latest captures to visual-audit branch
        if: success()
        run: |
          set -euo pipefail
          rm -rf /tmp/break-cars-loop-audit
          mkdir -p /tmp/break-cars-loop-audit
          cp -a artifacts/live-loop-visual-audit/. /tmp/break-cars-loop-audit/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+yz4git@users.noreply.github.com"
          git checkout --orphan visual-audit
          git rm -rf .
          mkdir -p latest
          cp -a /tmp/break-cars-loop-audit/. latest/
          printf '%s\n' "source_sha=${GITHUB_SHA}" "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest/source.txt
          git add latest
          git commit -m "Update BREAK CARS live loop captures"
          git push --force origin visual-audit
