name: SKY FORGE flip diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare game
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Trace SKY FORGE seed 1 flip
        run: |
          cat > /tmp/sky-flip.mjs <<'EOF'
          globalThis.location={search:'?course=sky-forge'};
          const physics=await import(`${process.cwd()}/_site/physics.js?d=${Date.now()}`);
          const p3=await import(`${process.cwd()}/_site/physics3d.js?d=${Date.now()}`);
          const racing=await import(`${process.cwd()}/_site/racing.js?d=${Date.now()}`);
          const {makeWorld,step}=physics;const {samplePhysicsSurface,fullPhysicsFeatureSpec}=p3;const {trackPoint,LENGTH}=racing;
          const w=makeWorld(0,1,'racing');w.done=false;w.endAt=999;w.limit=999;for(const x of w.cars.slice(1)){x.finished=true;x.dead=false;x.vx=x.vz=0;}
          const c=w.cars[0],up=b=>({x:2*(b.qx*b.qy-b.qz*b.qw),y:1-2*(b.qx*b.qx+b.qz*b.qz),z:2*(b.qy*b.qz+b.qx*b.qw)});let firstNeg=null,minAlign=1,trace=[];
          console.log('SPEC',JSON.stringify(fullPhysicsFeatureSpec().race));
          for(let frame=0;frame<1500&&!w.done;frame++){
            step(w,{},1/60,true);const b=c.p3,u=up(b),road=trackPoint(c.trackS||0),s=samplePhysicsSurface('racing',b.px,b.py,b.pz,u,true,c.trackS),align=s?u.x*s.normal.x+u.y*s.normal.y+u.z*s.normal.z:9,speed=Math.hypot(b.vx,b.vy,b.vz);minAlign=Math.min(minAlign,align);
            const snap={frame,time:+w.time.toFixed(3),s:+c.trackS.toFixed(3),d:+c.raceDistance.toFixed(3),kind:road.kind,y:+b.py.toFixed(3),roadY:+road.y.toFixed(3),speed:+speed.toFixed(3),upY:+u.y.toFixed(3),align:+align.toFixed(3),wheels:b.groundedWheels,air:+(b.airTime||0).toFixed(3),timer:+(c.autoUprightTime||0).toFixed(3),boost:!!c.rampageBoost,stabilizer:!!c.rampageExitStabilizer};
            if(!firstNeg&&align<-.3)firstNeg=snap;
            if((c.trackS>110&&c.trackS<220&&frame%15===0)||align<-.25||(c.autoUprightTime||0)>.05)trace.push(snap);
            if(w.events.some(e=>e.type==='auto-upright'))break;
          }
          console.log(JSON.stringify({length:LENGTH,firstNeg,minAlign,final:{s:c.trackS,d:c.raceDistance,time:w.time},trace:trace.slice(-260)},null,2));
          EOF
          node /tmp/sky-flip.mjs
