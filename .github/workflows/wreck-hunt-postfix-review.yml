name: Wreck Hunt Post-fix Review
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Run Wreck Hunt post-fix visual review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Prepare production build
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Play Wreck Hunt
        run: |
          mkdir -p visual-review
          python3 -m http.server 4173 --directory _site >/tmp/server.log 2>&1 &
          for i in {1..20}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > .postfix-review.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'fs';
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--disable-gpu-vsync','--disable-frame-rate-limit']});
          const page=await browser.newPage({viewport:{width:852,height:393},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'});
          const logs=[]; page.on('console',m=>logs.push(`${m.type()}: ${m.text()}`)); page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
          const state=async()=>page.evaluate(()=>({score:score.innerText,wrecks:alive.innerText,time:document.querySelector('#time').innerText,hp:document.querySelector('#hp').innerText,speed:document.querySelector('#speed b').innerText,combo:document.querySelector('#hunt-combo').innerText,chainState:document.querySelector('#hunt-state').innerText,toast:document.querySelector('#toast').innerText,scoreLabel:document.querySelector('#score-label')?.innerText,viewport:{scale:visualViewport.scale,offsetLeft:visualViewport.offsetLeft,offsetTop:visualViewport.offsetTop,scrollX,scrollY}}));
          const samples=[]; const shot=async n=>page.screenshot({path:`visual-review/${n}.png`});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'}); await page.click('[data-mode="wreck-hunt"]'); await shot('01-selected'); await page.click('#start'); await page.waitForTimeout(4800); samples.push(await state()); await shot('02-opening');
          await page.keyboard.down('ArrowUp');
          const seq=[[null,2300],['ArrowLeft',900],[null,1500],['ArrowRight',1100],[null,1500],['ArrowLeft',800],[null,1800],['ArrowRight',900],[null,1600],['ArrowLeft',700],[null,1800],['ArrowRight',800],[null,1800]];
          let i=3; let prevW='0';
          for(const [key,ms] of seq){if(key)await page.keyboard.down(key);await page.waitForTimeout(ms);if(key)await page.keyboard.up(key);const s=await state();samples.push(s);if(i<=9||s.wrecks!==prevW){await shot(String(i).padStart(2,'0')+'-play');prevW=s.wrecks;}i++;}
          await page.keyboard.up('ArrowUp'); await page.keyboard.down('ArrowDown'); await page.keyboard.down('ArrowRight'); await page.waitForTimeout(1500); await page.keyboard.up('ArrowRight'); await page.keyboard.up('ArrowDown'); samples.push(await state()); await shot('10-recovery');
          const final=await state(); final.samples=samples; final.logs=logs; fs.writeFileSync('visual-review/report.json',JSON.stringify(final,null,2)); await browser.close();
          JS
          node .postfix-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: break-cars-wreck-hunt-postfix-review
          path: visual-review
          retention-days: 1
