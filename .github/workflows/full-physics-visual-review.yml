name: Full physics visual review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production artifact
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          cat >> _site/game.js <<'EOF'
          window.__bcReview={
            world:()=>world,
            player:()=>world.cars[0],
            forcePlay:()=>{mode='race';count=0;world.done=false;document.body.classList.add('playing');},
            advance:(frames,input={gas:0,brake:0,hand:0,steer:0})=>{let maxY=-Infinity,maxAir=0,minUpY=1,maxUpY=-1,maxWheels=0;for(let i=0;i<frames;i++){step(world,input,1/60,false);const b=world.cars[0].p3;if(b){maxY=Math.max(maxY,b.py);maxAir=Math.max(maxAir,b.airTime);const upY=1-2*(b.qx*b.qx+b.qz*b.qz);minUpY=Math.min(minUpY,upY);maxUpY=Math.max(maxUpY,upY);maxWheels=Math.max(maxWheels,b.groundedWheels||0);}}return{maxY,maxAir,minUpY,maxUpY,maxWheels,time:world.time};},
            teleport:(x,y,z,heading=0,vx=0,vy=0,vz=0)=>{const c=world.cars[0],h=heading*.5;c.x=x;c.z=z;c.heading=heading;c.vx=vx;c.vz=vz;c.omega=0;c.dead=false;c.finished=false;c.hp=c.maxHP;c.p3={...(c.p3||{}),active:true,px:x,py:y,pz:z,qx:0,qy:Math.sin(h),qz:0,qw:Math.cos(h),vx,vy,vz,wx:0,wy:0,wz:0,grounded:false,groundedWheels:0,wheelCompression:[0,0,0,0],wheelNormal:[0,0,0,0],airTime:0,lastLandingAt:-99,lastSyncX:x,lastSyncZ:z,lastSyncVx:vx,lastSyncVz:vz};},
            quietTargets:()=>{for(const c of world.cars.slice(1)){c.dead=true;c.finished=true;c.respawnAt=Infinity;c.vx=0;c.vz=0;if(c.p3){c.p3.vx=c.p3.vy=c.p3.vz=0;}}if(world.hunt)world.hunt.focusId=-1;world.done=false;},
            loopSetup:()=>{const c=world.cars[0],b=c.p3,s=Math.SQRT1_2,x=25,y=5.5,z=14.6;c.x=x;c.z=z;c.heading=0;c.vx=0;c.vz=0;c.dead=false;c.finished=false;c.hp=c.maxHP;Object.assign(b,{active:true,px:x,py:y,pz:z,qx:-s,qy:0,qz:0,qw:s,vx:0,vy:16,vz:0,wx:0,wy:0,wz:0,grounded:false,groundedWheels:0,wheelCompression:[0,0,0,0],wheelNormal:[0,0,0,0],airTime:0,lastSyncX:x,lastSyncZ:z,lastSyncVx:0,lastSyncVz:0});world.done=false;},
            rideSetup:()=>{const w=world,a=w.cars[0],v=w.cars[1];window.__bcReview.teleport(0,.9,-4.6,0,0,0,19);v.dead=false;v.finished=false;v.hp=v.maxHP;v.x=0;v.z=0;v.heading=0;v.vx=v.vz=0;v.target=0;v.aiTimer=99;v.p3={active:true,px:0,py:.9,pz:0,qx:0,qy:0,qz:0,qw:1,vx:0,vy:0,vz:0,wx:0,wy:0,wz:0,mass:1,invMass:1,invIx:1,invIy:1,invIz:1,grounded:false,groundedWheels:0,wheelCompression:[0,0,0,0],wheelNormal:[0,0,0,0],airTime:0,lastLandingAt:-99,lastSyncX:0,lastSyncZ:0,lastSyncVx:0,lastSyncVz:0};for(const c of w.cars.slice(2)){c.dead=true;c.finished=true;c.respawnAt=Infinity;}w.done=false;}
          };
          EOF
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium --with-deps
      - name: Run rendered review
        run: |
          python3 -m http.server 4173 -d _site >/tmp/bc-server.log 2>&1 &
          cat > review.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--disable-gpu-vsync']});
          const page=await browser.newPage({viewport:{width:852,height:393},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
          const logs=[];page.on('console',m=>logs.push(`console ${m.type()}: ${m.text()}`));page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.screenshot({path:'01-menu.png'});
          await page.click('[data-mode="wreck-hunt"]');await page.click('#start');
          await page.waitForFunction(()=>window.__bcReview?.player());
          await page.evaluate(()=>{window.__bcReview.forcePlay();window.__bcReview.advance(100,{gas:1,brake:0,hand:0,steer:0});});await page.waitForTimeout(120);
          await page.screenshot({path:'02-hunt-live.png'});

          // Clean deterministic jump pass.
          await page.evaluate(()=>{window.__bcReview.quietTargets();window.__bcReview.forcePlay();window.__bcReview.teleport(-22,.9,-14.6,0,0,0,19);});
          const jumpA=await page.evaluate(()=>window.__bcReview.advance(20,{gas:1,brake:0,hand:0,steer:0}));await page.waitForTimeout(100);
          await page.screenshot({path:'03-ramp-climb.png'});
          const jumpB=await page.evaluate(()=>window.__bcReview.advance(32,{gas:1,brake:0,hand:0,steer:0}));await page.waitForTimeout(100);
          await page.screenshot({path:'04-jump-air.png'});
          const jump=await page.evaluate(()=>{const b=window.__bcReview.player().p3;return{p:[b.px,b.py,b.pz],v:[b.vx,b.vy,b.vz],air:b.airTime,q:[b.qx,b.qy,b.qz,b.qw],wheels:b.groundedWheels};});

          // Correct loop COM path: 0.9m inside the visible road radius.
          await page.evaluate(()=>{window.__bcReview.quietTargets();window.__bcReview.forcePlay();window.__bcReview.loopSetup();});
          const loopA=await page.evaluate(()=>window.__bcReview.advance(25,{gas:1,brake:0,hand:0,steer:0}));await page.waitForTimeout(100);
          await page.screenshot({path:'05-loop-side.png'});
          const loopB=await page.evaluate(()=>window.__bcReview.advance(34,{gas:1,brake:0,hand:0,steer:0}));await page.waitForTimeout(100);
          await page.screenshot({path:'06-loop-top.png'});
          const loop=await page.evaluate(()=>{const b=window.__bcReview.player().p3;return{p:[b.px,b.py,b.pz],q:[b.qx,b.qy,b.qz,b.qw],up:[2*(b.qx*b.qy-b.qz*b.qw),1-2*(b.qx*b.qx+b.qz*b.qz),2*(b.qy*b.qz+b.qx*b.qw)],grounded:b.grounded,wheels:b.groundedWheels};});

          // Direct car-on-car ride-over contact.
          await page.evaluate(()=>{window.__bcReview.forcePlay();window.__bcReview.rideSetup();});
          const rideStats=await page.evaluate(()=>window.__bcReview.advance(18,{gas:1,brake:0,hand:0,steer:0}));await page.waitForTimeout(100);
          await page.screenshot({path:'07-ride-over.png'});
          const ride=await page.evaluate(()=>{const w=window.__bcReview.world(),a=w.cars[0].p3,b=w.cars[1].p3;return{hunter:{p:[a.px,a.py,a.pz],q:[a.qx,a.qy,a.qz,a.qw]},victim:{p:[b.px,b.py,b.pz],q:[b.qx,b.qy,b.qz,b.qw]},contacts:w.cars[0].contacts};});
          const viewport=await page.evaluate(()=>({scale:visualViewport?.scale,offsetLeft:visualViewport?.offsetLeft,offsetTop:visualViewport?.offsetTop,scrollX,scrollY,innerWidth,innerHeight}));
          fs.writeFileSync('report.json',JSON.stringify({jumpA,jumpB,jump,loopA,loopB,loop,rideStats,ride,viewport,logs},null,2));
          await browser.close();
          EOF
          node review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: break-cars-full-physics-review
          path: |
            01-menu.png
            02-hunt-live.png
            03-ramp-climb.png
            04-jump-air.png
            05-loop-side.png
            06-loop-top.png
            07-ride-over.png
            report.json
