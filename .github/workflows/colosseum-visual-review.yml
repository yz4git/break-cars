name: Colosseum Visual Review
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Colosseum visual review run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Run colosseum gameplay review
        run: |
          mkdir -p visual-review
          python3 -m http.server 4173 --directory dist >/tmp/break-cars-http.log 2>&1 &
          for i in {1..20}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > .colosseum-review.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport:{width:852,height:393},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          });
          const page = await context.newPage();
          const logs=[];
          page.on('console',m=>logs.push(`console ${m.type()}: ${m.text()}`));
          page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.screenshot({path:'visual-review/01-menu.png'});
          await page.click('button[data-mode="colosseum"]');
          await page.screenshot({path:'visual-review/02-colosseum-selected.png'});
          await page.click('#start');
          await page.waitForTimeout(7000);
          await page.screenshot({path:'visual-review/03-opening.png'});

          // Drive hard into the arena pack.
          await page.keyboard.down('ArrowUp');
          await page.waitForTimeout(2600);
          await page.keyboard.down('ArrowLeft');
          await page.waitForTimeout(1600);
          await page.keyboard.up('ArrowLeft');
          await page.waitForTimeout(2400);
          await page.screenshot({path:'visual-review/04-first-contact.png'});
          await page.keyboard.down('ArrowRight');
          await page.waitForTimeout(1800);
          await page.keyboard.up('ArrowRight');
          await page.waitForTimeout(3200);
          await page.screenshot({path:'visual-review/05-brawl.png'});
          await page.keyboard.up('ArrowUp');
          await page.waitForTimeout(7000);
          await page.screenshot({path:'visual-review/06-later.png'});

          const report=await page.evaluate(()=>({
            title:document.title,
            bodyClass:document.body.className,
            survivors:document.querySelector('#alive')?.innerText,
            score:document.querySelector('#score')?.innerText,
            time:document.querySelector('#time')?.innerText,
            speed:document.querySelector('#speed')?.innerText,
            hp:document.querySelector('#hp')?.innerText,
            viewport:{
              scale:visualViewport?.scale,
              offsetLeft:visualViewport?.offsetLeft,
              offsetTop:visualViewport?.offsetTop,
              width:visualViewport?.width,
              height:visualViewport?.height,
              scrollX,scrollY,innerWidth,innerHeight
            },
            controls:[...document.querySelectorAll('#steer,.pedals button')].map(el=>({id:el.id,rect:el.getBoundingClientRect().toJSON()}))
          }));
          report.logs=logs;
          fs.writeFileSync('visual-review/report.json',JSON.stringify(report,null,2));
          await browser.close();
          JS
          node .colosseum-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: break-cars-colosseum-visual-review
          path: visual-review
          retention-days: 1
