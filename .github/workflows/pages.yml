name: Publish game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Pages artifact
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Check generated JavaScript
        run: |
          node --check _site/courses.js
          node --check _site/course-view.js
          node --check _site/game.js
          node --check _site/physics.js
          node --check _site/physics3d.js
          node --check _site/racing.js
          node --check _site/racing3d.js
          node --check _site/track-view.js
          node --check _site/viewport-guard.js
          node --check _site/colosseum-ui.js
      - name: Test WRECK HUNT
        run: node scripts/test-wreck-hunt.mjs
      - name: Test full 3D physics
        run: node scripts/test-full-physics3d.mjs
      - name: Test racing 3D
        run: node scripts/test-racing3d.mjs
      - name: Test natural loop connection
        run: node scripts/test-natural-loop-connection.mjs
      - name: Test RAMPAGE raceability
        run: node scripts/test-rampage-raceability.mjs
      - name: Test RAMPAGE boost
        run: node scripts/test-rampage-boost.mjs
      - name: Test player auto-upright
        run: node scripts/test-player-auto-upright.mjs
      - name: Test course pack
        run: node scripts/test-courses.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
