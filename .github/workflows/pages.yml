name: Publish game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Pages artifact
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Check generated JavaScript
        run: |
          node --check _site/courses.js
          node --check _site/course-view.js
          node --check _site/game.js
          node --check _site/physics.js
          node --check _site/physics3d.js
          node --check _site/racing.js
          node --check _site/racing3d.js
          node --check _site/track-view.js
          node --check _site/viewport-guard.js
          node --check _site/colosseum-ui.js
      - name: Test WRECK HUNT
        run: node scripts/test-wreck-hunt.mjs
      - name: Test full 3D physics
        run: node scripts/test-full-physics3d.mjs
      - name: Test WRECKING RACING math rebuild
        run: node scripts/test-wrecking-racing-math-v1.mjs
      - name: Test WRECKING RACING tactical contact zones
        run: node scripts/test-wrecking-racing-contact-zones-v2.mjs
      - name: Test WRECKING RACING battle rhythm
        run: node scripts/test-wrecking-racing-battle-rhythm-v3.mjs
      - name: Test WRECKING RACING rival duel
        run: node scripts/test-wrecking-racing-rival-duel-v4.mjs
      - name: Test player auto-upright
        run: node scripts/test-player-auto-upright.mjs
      - name: Test non-racing course pack
        run: |
          for course in crater-crown tidal-foundry maelstrom-pit cross-fire; do
            COURSE_TEST="$course" node scripts/test-courses.mjs
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
