name: Publish game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare cache-busted Pages artifact
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          node --check _site/game.js
          node --check _site/physics.js
          node --check _site/physics3d.js
          node --check _site/racing.js
          node --check _site/racing3d.js
          node --check _site/track-view.js
          node --check _site/viewport-guard.js
          node --check _site/colosseum-ui.js
          node scripts/test-wreck-hunt.mjs
          node scripts/test-full-physics3d.mjs
          node scripts/test-racing3d.mjs
          node scripts/test-rampage-raceability.mjs
          node scripts/test-rampage-boost.mjs
          node scripts/test-player-auto-upright.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
