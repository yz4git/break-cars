name: RAMPAGE 3D targeted playcheck
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  playcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare instrumented game
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          cat >> _site/game.js <<'EOF'
          window.__targetCheck={
            reset:(value)=>{seed=value>>>0;gameMode='racing';selection=0;resetWorld();mode='race';count=0;world.done=false;world.endAt=999;world.limit=999;},
            quiet:()=>{for(let i=1;i<world.cars.length;i++){const c=world.cars[i];c.dead=true;c.finished=false;c.vx=c.vz=0;if(c.p3)c.p3.vx=c.p3.vy=c.p3.vz=0;if(carMeshes[i])carMeshes[i].g.visible=false;}world.done=false;world.endAt=999;world.limit=999;},
            place:(s,speed=20,lane=0)=>{const c=world.cars[0],p=trackPoint(s,lane);Object.assign(c,{trackS:p.s,raceDistance:s,lane,x:p.x,z:p.z,heading:p.heading,vx:p.forward.x*speed,vz:p.forward.z*speed,dead:false,finished:false,wrongWay:0});c.p3=null;world.done=false;world.endAt=999;world.limit=999;if(carMeshes[0])carMeshes[0].g.visible=true;},
            spec:()=>fullPhysicsSpec.race,
            probe:(startS,frames,speed=20)=>{window.__targetCheck.place(startS,speed,0);const L=LENGTH,wrap=(a,b)=>{let d=a-b;if(d>L/2)d-=L;if(d<-L/2)d+=L;return d;};let prev=null,maxMove=0,maxS=0,maxProgress=0,maxCenter=0,minY=Infinity,maxY=-Infinity,anomalies=[];for(let i=0;i<frames&&!world.done;i++){step(world,{gas:1,brake:0,hand:0,steer:0},1/60,false);const c=world.cars[0],b=c.p3,p=trackPoint(c.trackS),cur={x:b.px,y:b.py,z:b.pz,s:c.trackS,r:c.raceDistance,kind:p.kind,center:Math.hypot(b.px-p.x,b.py-p.y,b.pz-p.z)};if(prev){const move=Math.hypot(cur.x-prev.x,cur.y-prev.y,cur.z-prev.z),ds=Math.abs(wrap(cur.s,prev.s)),dr=Math.abs(cur.r-prev.r);maxMove=Math.max(maxMove,move);maxS=Math.max(maxS,ds);maxProgress=Math.max(maxProgress,dr);maxCenter=Math.max(maxCenter,cur.center);if((move>6||ds>8||dr>6||cur.center>24||cur.y<-12||cur.y>36)&&anomalies.length<12)anomalies.push({frame:i,move,ds,dr,center:cur.center,y:cur.y,kind:cur.kind,from:prev,to:cur});}minY=Math.min(minY,cur.y);maxY=Math.max(maxY,cur.y);prev=cur;}return{startS,frames,maxMove,maxS,maxProgress,maxCenter,minY,maxY,final:prev,anomalies};},
            pack:(value,frames=900)=>{window.__targetCheck.reset(value);const L=LENGTH,wrap=(a,b)=>{let d=a-b;if(d>L/2)d-=L;if(d<-L/2)d+=L;return d;};let prev=world.cars.map(c=>({x:c.p3?.px??c.x,y:c.p3?.py??0,z:c.p3?.pz??c.z,s:c.trackS,r:c.raceDistance})),maxMove=0,maxS=0,maxProgress=0,maxCenter=0,anomalies=[];for(let f=0;f<frames&&!world.done;f++){step(world,{},1/60,true);for(const c of world.cars){if(c.dead||!c.p3)continue;const p=trackPoint(c.trackS),pr=prev[c.id],move=Math.hypot(c.p3.px-pr.x,c.p3.py-pr.y,c.p3.pz-pr.z),ds=Math.abs(wrap(c.trackS,pr.s)),dr=Math.abs(c.raceDistance-pr.r),center=Math.hypot(c.p3.px-p.x,c.p3.py-p.y,c.p3.pz-p.z),intent=world.events.some(e=>(e.type==='auto-upright'||e.type==='recover')&&e.car===c.id);maxMove=Math.max(maxMove,move);maxS=Math.max(maxS,ds);maxProgress=Math.max(maxProgress,dr);maxCenter=Math.max(maxCenter,center);if(((!intent&&move>6)||ds>8||dr>6||(center>24&&p.kind!=='jump-gap')||c.p3.py<-12||c.p3.py>36)&&anomalies.length<20)anomalies.push({frame:f,car:c.id,move,ds,dr,center,y:c.p3.py,kind:p.kind,events:world.events.map(e=>e.type)});prev[c.id]={x:c.p3.px,y:c.p3.py,z:c.p3.pz,s:c.trackS,r:c.raceDistance};}}return{seed:value,frames,time:world.time,maxMove,maxS,maxProgress,maxCenter,playerLap:world.cars[0].lap,anomalies};}
          };
          EOF
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium --with-deps
      - name: Run targeted gameplay checks
        run: |
          python3 -m http.server 4173 -d _site >/tmp/rampage-target-server.log 2>&1 &
          cat > targeted.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--disable-gpu-vsync','--disable-frame-rate-limit']});
          const page=await browser.newPage({viewport:{width:852,height:393},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
          const logs=[];page.on('console',m=>logs.push(`console ${m.type()}: ${m.text()}`));page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.click('[data-mode="racing"]');await page.click('#start');await page.waitForTimeout(4300);await page.screenshot({path:'live-rampage.png'});await page.waitForFunction(()=>window.__targetCheck);
          const spec=await page.evaluate(()=>window.__targetCheck.spec());await page.evaluate(()=>{window.__targetCheck.reset(919);window.__targetCheck.quiet();});
          const low=await page.evaluate(()=>window.__targetCheck.probe(-12,150,20));await page.waitForTimeout(50);await page.screenshot({path:'01-low-crossing.png'});
          const high=await page.evaluate(s=>window.__targetCheck.probe(s-12,150,20),spec.bridge.s);await page.waitForTimeout(50);await page.screenshot({path:'02-high-crossing.png'});
          const jump=await page.evaluate(s=>window.__targetCheck.probe(s-12,210,22),spec.jump.startS);await page.waitForTimeout(50);await page.screenshot({path:'03-jump.png'});
          const loop=await page.evaluate(s=>window.__targetCheck.probe(s+.35,300,24),spec.loop.startS);await page.waitForTimeout(50);await page.screenshot({path:'04-loop.png'});
          const pack=await page.evaluate(()=>window.__targetCheck.pack(144,900));await page.waitForTimeout(60);await page.screenshot({path:'05-pack.png'});
          const viewport=await page.evaluate(()=>({scale:visualViewport?.scale,offsetLeft:visualViewport?.offsetLeft,offsetTop:visualViewport?.offsetTop,scrollX,scrollY,innerWidth,innerHeight}));fs.writeFileSync('target-report.json',JSON.stringify({spec,low,high,jump,loop,pack,logs,viewport},null,2));await browser.close();
          EOF
          node targeted.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rampage-targeted-playcheck
          path: |
            live-rampage.png
            01-low-crossing.png
            02-high-crossing.png
            03-jump.png
            04-loop.png
            05-pack.png
            target-report.json
