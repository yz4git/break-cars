name: MAYHEM cinematic review

on:
  push:
    branches: [main]
    paths:
      - '.github/mayhem-cinematic-review.mjs'
      - '.github/workflows/mayhem-cinematic-review.yml'
      - 'scripts/polish-mayhem-tour-v4.py'
      - 'scripts/polish-mayhem-product-v8.py'
      - 'scripts/polish-mayhem-product-v81.py'
      - 'scripts/polish-mayhem-product-v82.py'
      - 'scripts/polish-mayhem-product-v83.py'
      - 'scripts/polish-mayhem-product-v84.py'
      - 'scripts/polish-mayhem-rivalry-v85.py'
      - 'scripts/polish-mayhem-final-duel-v86.py'
      - 'scripts/polish-mayhem-showdown-v87.py'
      - 'scripts/add-mayhem-highlight-replay-v7.py'
      - 'scripts/apply-mayhem-rival-director-v5.py'
      - 'scripts/expand-mayhem-nine-course-v6.py'
      - 'scripts/test-mayhem-roadmap.mjs'
      - 'scripts/prepare-pages.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Prepare exact game build
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Check generated game
        run: |
          node --check _site/game.js
          node scripts/test-mayhem-roadmap.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve generated game
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/mayhem-cinematic-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/mayhem-cinematic-http.log
          exit 1
      - name: Capture MAYHEM cinematic review
        env:
          BREAK_CARS_AUDIT_URL: http://127.0.0.1:4173/
        run: node .github/mayhem-cinematic-review.mjs
      - name: Upload MAYHEM cinematic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: break-cars-mayhem-cinematic-${{ github.sha }}
          path: artifacts/mayhem-cinematic-review
          if-no-files-found: error
          retention-days: 7
