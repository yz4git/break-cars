name: Wreck Hunt Visual Review
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    if: github.event.head_commit.message == 'Wreck Hunt visual review run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Prepare deployed build
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Run Wreck Hunt gameplay review
        run: |
          mkdir -p visual-review
          python3 -m http.server 4173 --directory _site >/tmp/break-cars-http.log 2>&1 &
          for i in {1..20}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          cat > .wreck-hunt-review.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            viewport:{width:852,height:393},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true,
            userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1'
          });
          const page = await context.newPage();
          const logs=[];
          page.on('console',m=>logs.push(`console ${m.type()}: ${m.text()}`));
          page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.screenshot({path:'visual-review/01-menu.png'});
          await page.click('button[data-mode="wreck-hunt"]');
          await page.screenshot({path:'visual-review/02-selected.png'});
          await page.click('button[data-car="2"]');
          await page.click('#start');
          await page.waitForTimeout(6500);
          await page.screenshot({path:'visual-review/03-opening.png'});

          await page.keyboard.down('ArrowUp');
          const patterns=[
            ['ArrowLeft',1800,1800],['ArrowRight',2200,1500],['ArrowLeft',2500,1100],
            ['ArrowRight',2600,1600],['ArrowLeft',2200,1900],['ArrowRight',2800,1300],
            ['ArrowLeft',2600,1200],['ArrowRight',2400,1500]
          ];
          let shot=4;
          for(const [key,hold,straight] of patterns){
            await page.keyboard.down(key);
            await page.waitForTimeout(hold);
            await page.keyboard.up(key);
            await page.waitForTimeout(straight);
            if(shot<=8) await page.screenshot({path:`visual-review/0${shot++}-hunt.png`});
          }
          await page.keyboard.up('ArrowUp');
          await page.waitForTimeout(2500);
          await page.screenshot({path:'visual-review/09-later.png'});

          const report=await page.evaluate(()=>({
            title:document.title,
            selectedMode:document.querySelector('.mode-select [data-mode].selected')?.dataset.mode,
            positionLabel:document.querySelector('#position-label')?.textContent,
            alive:document.querySelector('#alive')?.innerText,
            score:document.querySelector('#score')?.innerText,
            time:document.querySelector('#time')?.innerText,
            hp:document.querySelector('#hp')?.innerText,
            speed:document.querySelector('#speed b')?.innerText,
            huntCombo:document.querySelector('#hunt-combo')?.innerText,
            huntWrecks:document.querySelector('#hunt-wrecks')?.innerText,
            huntState:document.querySelector('#hunt-state')?.innerText,
            huntHidden:document.querySelector('#hunt-info')?.classList.contains('hidden'),
            viewport:{scale:visualViewport?.scale,offsetLeft:visualViewport?.offsetLeft,offsetTop:visualViewport?.offsetTop,scrollX,scrollY,innerWidth,innerHeight},
            controls:[...document.querySelectorAll('#steer,.pedals button')].map(el=>({id:el.id,rect:el.getBoundingClientRect().toJSON()}))
          }));
          report.logs=logs;
          fs.writeFileSync('visual-review/report.json',JSON.stringify(report,null,2));
          await browser.close();
          JS
          node .wreck-hunt-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: break-cars-wreck-hunt-visual-review
          path: visual-review
          retention-days: 1
