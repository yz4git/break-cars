name: SKY FORGE multi-seed diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare game
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Run SKY FORGE multi-seed fixed-step diagnostic
        run: |
          cat > /tmp/sky-multiseed.mjs <<'EOF'
          globalThis.location={search:'?course=sky-forge'};
          const physics=await import(`${process.cwd()}/_site/physics.js?d=${Date.now()}`);
          const p3=await import(`${process.cwd()}/_site/physics3d.js?d=${Date.now()}`);
          const racing=await import(`${process.cwd()}/_site/racing.js?d=${Date.now()}`);
          const {makeWorld,step}=physics;const {samplePhysicsSurface}=p3;const {trackPoint,LENGTH}=racing;
          const seeds=[1,17,31,77,144,733,912,2468,4096,12345,54321,99991,2132980000,2132990000,2133000000,2133010000];
          const bodyUp=b=>({x:2*(b.qx*b.qy-b.qz*b.qw),y:1-2*(b.qx*b.qx+b.qz*b.qz),z:2*(b.qy*b.qz+b.qx*b.qw)});
          const results=[];
          for(const seed of seeds){
            const w=makeWorld(0,seed,'racing');w.done=false;w.endAt=999;w.limit=999;
            for(const c of w.cars.slice(1)){c.finished=true;c.dead=false;c.vx=c.vz=0;}
            const c=w.cars[0];let auto=0,maxTimer=0,lastTimer=null,autoSnap=null,longestStuck=0,stuck=0,frames=0;
            for(;frames<2200&&!w.done&&c.raceDistance<LENGTH*.985;frames++){
              step(w,{},1/60,true);const b=c.p3;if(!b)continue;const up=bodyUp(b),surface=samplePhysicsSurface('racing',b.px,b.py,b.pz,up,true,c.trackS),road=trackPoint(c.trackS||0),align=surface?up.x*surface.normal.x+up.y*surface.normal.y+up.z*surface.normal.z:999,speed=Math.hypot(b.vx,b.vy,b.vz);
              if(speed<1.4){stuck++;longestStuck=Math.max(longestStuck,stuck);}else stuck=0;
              maxTimer=Math.max(maxTimer,c.autoUprightTime||0);
              const snap={seed,frame:frames,time:+w.time.toFixed(3),trackS:+c.trackS.toFixed(3),raceDistance:+c.raceDistance.toFixed(3),kind:road.kind,speed:+speed.toFixed(3),upY:+up.y.toFixed(3),align:+align.toFixed(3),wheels:b.groundedWheels,air:+(b.airTime||0).toFixed(3),timer:+(c.autoUprightTime||0).toFixed(3),y:+b.py.toFixed(3),surface:surface?.kind,d:+(surface?.d??999).toFixed(3)};
              if((c.autoUprightTime||0)>.05)lastTimer=snap;
              for(const e of w.events)if(e.type==='auto-upright'){auto++;autoSnap={...snap,event:e,pre:lastTimer};}
            }
            results.push({seed,auto,maxTimer:+maxTimer.toFixed(3),longestStuck:+(longestStuck/60).toFixed(2),distance:+c.raceDistance.toFixed(2),frames,autoSnap});
          }
          const failed=results.filter(r=>r.auto||r.maxTimer>1||r.distance<LENGTH*.985||r.longestStuck>2.5);
          console.log(JSON.stringify({length:LENGTH,seeds:results.length,failed,results},null,2));
          if(failed.some(r=>r.auto||r.distance<LENGTH*.985))process.exitCode=1;
          EOF
          node /tmp/sky-multiseed.mjs
