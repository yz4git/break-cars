name: RAMPAGE pile-up diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and inspect deterministic pile-up
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          cat > /tmp/diagnose.mjs <<'EOF'
          import fs from 'node:fs';
          const physics=await import(`file://${process.cwd()}/_site/physics.js?diag=${Date.now()}`);
          const {makeWorld,step}=physics;
          // Exact browser playcheck setup: selection/type 0, seed 144, racing autoplay.
          const w=makeWorld(0,144,'racing');
          const rows=[];let max={move:0,frame:-1,car:-1};
          let prev=w.cars.map(c=>({x:c.x,y:0,z:c.z,vx:c.vx||0,vy:0,vz:c.vz||0,body:false,token:null}));
          for(let frame=0;frame<505&&!w.done;frame++){
            const before=prev.map(v=>({...v}));
            step(w,{},1/60,true);
            for(const c of w.cars){
              const b=c.p3,p=before[c.id];if(!b)continue;
              const move=Math.hypot(b.px-p.x,b.py-p.y,b.pz-p.z);if(move>max.move)max={move,frame,car:c.id};
              const replaced=p.body&&!b._diagToken;
              if(!b._diagToken)b._diagToken=`${c.id}-${frame}`;
              if((frame>=486&&frame<=493&&c.id===8)||move>1.5){
                const near=w.cars.filter(o=>o.id!==c.id&&o.p3).map(o=>({id:o.id,d:Math.hypot(o.p3.px-b.px,o.p3.py-b.py,o.p3.pz-b.pz),v:Math.hypot(o.p3.vx,o.p3.vy,o.p3.vz),hp:o.hp,dead:o.dead})).filter(o=>o.d<12).sort((a,b)=>a.d-b.d);
                rows.push({frame,time:w.time,id:c.id,move,replaced,pre:p,pos:{x:b.px,y:b.py,z:b.pz},vel:{x:b.vx,y:b.vy,z:b.vz,speed:Math.hypot(b.vx,b.vy,b.vz)},ang:{x:b.wx,y:b.wy,z:b.wz},lastSync:{x:b.lastSyncX,z:b.lastSyncZ,vx:b.lastSyncVx,vz:b.lastSyncVz},legacy:{x:c.x,z:c.z,vx:c.vx,vz:c.vz,omega:c.omega},trackS:c.trackS,raceDistance:c.raceDistance,lane:c.lane,hp:c.hp,dead:c.dead,contacts:c.contacts,recoveryAt:c.recoveryAt,autoUprightTime:c.autoUprightTime,events:w.events.map(e=>({...e})),near});
              }
              prev[c.id]={x:b.px,y:b.py,z:b.pz,vx:b.vx,vy:b.vy,vz:b.vz,body:true,token:b._diagToken};
            }
          }
          fs.writeFileSync('diag-report.json',JSON.stringify({max,rows},null,2));
          console.log(JSON.stringify({max,large:rows.filter(r=>r.move>1.5)},null,2));
          EOF
          node /tmp/diagnose.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rampage-pack-diagnostic
          path: diag-report.json
