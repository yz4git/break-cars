name: RAMPAGE crown assist sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rampage-crown-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare crown assist candidates
        shell: bash
        run: |
          set -u
          cp scripts/boost-rampage-loop-v6.py /tmp/boost-original.py
          candidates=(baseline entry31_8 entry32_2 direct1_0 direct1_5 direct2_0 driveCurrent blend80 lookaheadSmall)
          for candidate in "${candidates[@]}"; do
            cp /tmp/boost-original.py scripts/boost-rampage-loop-v6.py
            CANDIDATE="$candidate" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/boost-rampage-loop-v6.py')
          s=p.read_text()
          c=os.environ['CANDIDATE']
          # The checked-in version contains a 3.2 m/s^2 current-tangent rescue.
          # Candidate transforms are intentionally tiny and independent.
          if c == 'baseline':
              s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
          elif c == 'entry31_8':
              s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
              s=s.replace('loopT<.12?31.0:','loopT<.12?31.8:').replace('):31.5,steepClimb','):31.8,steepClimb')
          elif c == 'entry32_2':
              s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
              s=s.replace('loopT<.12?31.0:','loopT<.12?32.2:').replace('):31.5,steepClimb','):32.2,steepClimb')
          elif c == 'direct1_0':
              s=s.replace('3.2*b.mass','1.0*b.mass')
          elif c == 'direct1_5':
              s=s.replace('3.2*b.mass','1.5*b.mass')
          elif c == 'direct2_0':
              s=s.replace('3.2*b.mass','2.0*b.mass')
          elif c == 'driveCurrent':
              s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
              s=s.replace('addForce(acc,mul(curveGuide?guideForward:road.forward,force));c.rampageBoost=true;', 'addForce(acc,mul(crownBand?road.forward:(curveGuide?guideForward:road.forward),force));c.rampageBoost=true;')
          elif c == 'blend80':
              s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
              s=s.replace('exitBlend?.42:.60),mul(ahead.forward,exitBlend?.58:.40)', 'exitBlend?.42:.80),mul(ahead.forward,exitBlend?.58:.20)')
          elif c == 'lookaheadSmall':
              s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
              s=s.replace('speed*.075','speed*.045')
          else:
              raise SystemExit(c)
          p.write_text(s)
          PY
            rm -rf _site
            if ! python3 scripts/prepare-pages.py >/tmp/build.log 2>&1; then
              echo "=== $candidate BUILD_FAIL ==="
              cat /tmp/build.log
              continue
            fi
            set +e
            node scripts/test-rampage-raceability.mjs >/tmp/race.log 2>&1
            race=$?
            node scripts/test-rampage-boost.mjs >/tmp/boost.log 2>&1
            boost=$?
            set -e
            echo "=== $candidate race=$race boost=$boost ==="
            grep -E 'RAMPAGE raceability OK|AssertionError|natural approach|minimum loop sample|RAMPAGE open-loop boost OK|loop speed fell|inverted crown lacks|loop entry should|max .*runaway' /tmp/race.log /tmp/boost.log || true
          done
          cp /tmp/boost-original.py scripts/boost-rampage-loop-v6.py
