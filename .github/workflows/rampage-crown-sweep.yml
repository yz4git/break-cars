name: RAMPAGE crown assist sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rampage-crown-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare fine lookahead candidates
        shell: bash
        run: |
          set -u
          cp scripts/boost-rampage-loop-v6.py /tmp/boost-original.py
          candidates=(la044 la042 la040 la038 la035 la032 blend85la045 blend90la045)
          for candidate in "${candidates[@]}"; do
            cp /tmp/boost-original.py scripts/boost-rampage-loop-v6.py
            CANDIDATE="$candidate" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/boost-rampage-loop-v6.py')
          s=p.read_text()
          c=os.environ['CANDIDATE']
          # Remove the experimental direct crown rescue first; refine only the
          # existing look-ahead guide so the natural 12-car trajectory remains intact.
          s=s.replace('crownRescue=inLoop&&loopT>.43&&loopT<.50,','crownRescue=false,')
          lookahead = {
              'la044': '.044',
              'la042': '.042',
              'la040': '.040',
              'la038': '.038',
              'la035': '.035',
              'la032': '.032',
              'blend85la045': '.045',
              'blend90la045': '.045',
          }[c]
          s=s.replace('speed*.075', f'speed*{lookahead}')
          if c == 'blend85la045':
              s=s.replace('exitBlend?.42:.60),mul(ahead.forward,exitBlend?.58:.40)', 'exitBlend?.42:.85),mul(ahead.forward,exitBlend?.58:.15)')
          elif c == 'blend90la045':
              s=s.replace('exitBlend?.42:.60),mul(ahead.forward,exitBlend?.58:.40)', 'exitBlend?.42:.90),mul(ahead.forward,exitBlend?.58:.10)')
          p.write_text(s)
          PY
            rm -rf _site
            if ! python3 scripts/prepare-pages.py >/tmp/build.log 2>&1; then
              echo "=== $candidate BUILD_FAIL ==="
              cat /tmp/build.log
              continue
            fi
            set +e
            node scripts/test-rampage-raceability.mjs >/tmp/race.log 2>&1
            race=$?
            node scripts/test-rampage-boost.mjs >/tmp/boost.log 2>&1
            boost=$?
            set -e
            echo "=== $candidate race=$race boost=$boost ==="
            grep -E 'RAMPAGE raceability OK|AssertionError|natural approach|minimum loop sample|RAMPAGE open-loop boost OK|loop speed fell|inverted crown lacks|loop entry should|max .*runaway' /tmp/race.log /tmp/boost.log || true
          done
          cp /tmp/boost-original.py scripts/boost-rampage-loop-v6.py
