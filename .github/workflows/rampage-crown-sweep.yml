name: RAMPAGE crown assist sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rampage-crown-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compare omega mid-descent guidance candidates
        shell: bash
        run: |
          set -u
          cp scripts/boost-rampage-loop-v6.py /tmp/boost-original.py
          candidates=(baseline dla06 dla08 dla10 ahead55 ahead65 combo0655 combo0865)
          for candidate in "${candidates[@]}"; do
            cp /tmp/boost-original.py scripts/boost-rampage-loop-v6.py
            CANDIDATE="$candidate" python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('scripts/boost-rampage-loop-v6.py')
          s=p.read_text()
          c=os.environ['CANDIDATE']
          marker='crownBand=inLoop&&loopT>.30&&loopT<.70,exitBlend='
          s=s.replace(marker,'crownBand=inLoop&&loopT>.30&&loopT<.70,midDescent=inLoop&&loopT>.43&&loopT<.66&&road.forward.y<-.20,exitBlend=')
          if c in {'dla06','dla08','dla10','combo0655','combo0865'}:
              factor={'dla06':'.060','dla08':'.080','dla10':'.100','combo0655':'.060','combo0865':'.080'}[c]
              s=s.replace('exitBlend?Math.min(4.0,Math.max(1.25,speed*.16)):Math.min(2.4,Math.max(.75,speed*.042))',f'exitBlend?Math.min(4.0,Math.max(1.25,speed*.16)):midDescent?Math.min(3.2,Math.max(1.0,speed*{factor})):Math.min(2.4,Math.max(.75,speed*.042))')
          if c in {'ahead55','ahead65','combo0655','combo0865'}:
              ahead={'ahead55':'.55','ahead65':'.65','combo0655':'.55','combo0865':'.65'}[c]
              current=str(round(1-float(ahead),2))
              s=s.replace('guideForward=curveGuide?norm(add(mul(road.forward,exitBlend?.42:.60),mul(ahead.forward,exitBlend?.58:.40))):road.forward',f'guideForward=curveGuide?norm(add(mul(road.forward,exitBlend?.42:midDescent?{current}:.60),mul(ahead.forward,exitBlend?.58:midDescent?{ahead}:.40))):road.forward')
          p.write_text(s)
          PY
            rm -rf _site
            if ! python3 scripts/prepare-pages.py >/tmp/build.log 2>&1; then
              echo "=== $candidate BUILD_FAIL ==="
              cat /tmp/build.log
              continue
            fi
            set +e
            node scripts/test-natural-loop-connection.mjs >/tmp/natural.log 2>&1
            natural=$?
            node scripts/test-rampage-raceability.mjs >/tmp/race.log 2>&1
            race=$?
            node scripts/test-rampage-boost.mjs >/tmp/boost.log 2>&1
            boost=$?
            set -e
            echo "=== $candidate natural=$natural race=$race boost=$boost ==="
            grep -E 'Natural front-entry open loops OK|RAMPAGE lower pair|RAMPAGE raceability OK|AssertionError|minimum loop sample|RAMPAGE open-loop boost OK|loop speed fell|inverted crown lacks|loop entry should|max .*runaway' /tmp/natural.log /tmp/race.log /tmp/boost.log || true
          done
          cp /tmp/boost-original.py scripts/boost-rampage-loop-v6.py
