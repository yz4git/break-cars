name: Nine-course final browser review
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare instrumented game
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          cat >> _site/game.js <<'EOF'
          const __reviewShow=()=>{$('menu').classList.add('hidden');$('modal').classList.add('hidden');$('hud').classList.remove('hidden');$('driving').classList.remove('hidden');$('countdown').textContent='';document.body.classList.add('playing');if(gameMode==='racing')$('race-info').classList.remove('hidden');else $('race-info').classList.add('hidden');const c=world.cars[0];camHeading=c.heading;camera.position.set(c.x-Math.sin(camHeading)*10,5,c.z-Math.cos(camHeading)*10);smoothLook.set(c.x,1.1,c.z);};
          const __reviewReset=()=>{gameMode=activeCourse.mode;selection=0;resetWorld();mode='race';count=0;world.done=false;world.endAt=999;world.limit=999;__reviewShow();};
          window.__nineCourseReview={
            startArena:()=>{__reviewReset();return window.__nineCourseReview.state();},
            startSolo:()=>{__reviewReset();for(let i=1;i<world.cars.length;i++){const c=world.cars[i];c.finished=true;c.dead=true;c.respawnAt=Infinity;c.x=800+i*9;c.z=800;c.vx=c.vz=0;if(c.p3){c.p3.px=c.x;c.p3.py=0;c.p3.pz=c.z;c.p3.vx=c.p3.vy=c.p3.vz=0;c.p3.wx=c.p3.wy=c.p3.wz=0;}if(carMeshes[i])carMeshes[i].g.visible=false;}return window.__nineCourseReview.state();},
            startPack:()=>{__reviewReset();for(const m of carMeshes)m.g.visible=true;return window.__nineCourseReview.state();},
            state:()=>{const c=world.cars[0],b=c.p3,upY=b?1-2*(b.qx*b.qx+b.qz*b.qz):1,rp=gameMode==='racing'?trackPoint(c.trackS??0):null,loops=gameMode==='racing'?(fullPhysicsSpec.race?.loops||[fullPhysicsSpec.race?.loop]).filter(Boolean):[];let loopIndex=-1;if(rp?.kind==='loop')loopIndex=loops.findIndex(l=>(c.trackS??0)>=l.startS&&(c.trackS??0)<=l.endS);return{course:activeCourse.id,name:activeCourse.name,mode:gameMode,time:world.time,alive:world.cars.filter(x=>!x.dead).length,playerDead:c.dead,hp:c.hp,x:b?.px??c.x,y:b?.py??0,z:b?.pz??c.z,speed:b?Math.hypot(b.vx,b.vy,b.vz):Math.hypot(c.vx,c.vz),upY,wheels:b?.groundedWheels??0,air:b?.airTime??0,trackS:c.trackS??0,raceDistance:c.raceDistance??0,lap:c.lap??0,kind:rp?.kind||'arena',loopIndex,loopCount:loops.length,autoUprightTime:c.autoUprightTime||0,exitStabilizer:!!c.rampageExitStabilizer};},
            cars:()=>world.cars.map(c=>{const b=c.p3;return{id:c.id,dead:c.dead,hp:c.hp,x:b?.px??c.x,y:b?.py??0,z:b?.pz??c.z,speed:b?Math.hypot(b.vx,b.vy,b.vz):Math.hypot(c.vx,c.vz),upY:b?1-2*(b.qx*b.qx+b.qz*b.qz):1,wheels:b?.groundedWheels??0,trackS:c.trackS??0,raceDistance:c.raceDistance??0,autoUprightTime:c.autoUprightTime||0,exitStabilizer:!!c.rampageExitStabilizer};}),
            spec:()=>gameMode==='racing'?fullPhysicsSpec.race:null,
            tick:(frames=1)=>{let impacts=0,recover=0,auto=0,walls=0;let player={maxY:-999,minY:999,maxSpeed:0,minUp:1,maxAir:0};for(let i=0;i<frames&&!world.done;i++){step(world,{},1/60,true);const c=world.cars[0],b=c.p3;if(b){const speed=Math.hypot(b.vx,b.vy,b.vz),u=1-2*(b.qx*b.qx+b.qz*b.qz);player.maxY=Math.max(player.maxY,b.py);player.minY=Math.min(player.minY,b.py);player.maxSpeed=Math.max(player.maxSpeed,speed);player.minUp=Math.min(player.minUp,u);player.maxAir=Math.max(player.maxAir,b.airTime||0);}for(const e of world.events){if(e.type==='impact')impacts++;else if(e.type==='recover')recover++;else if(e.type==='auto-upright')auto++;else if(e.type==='wall')walls++;}}return{...window.__nineCourseReview.state(),impacts,recover,auto,walls,player};}
          };
          EOF
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install chromium --with-deps
      - name: Play and capture all nine courses
        run: |
          python3 -m http.server 4173 -d _site >/tmp/nine-course.log 2>&1 &
          cat > review9.mjs <<'EOF'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const courses=['maelstrom-pit','classic','crater-crown','cross-fire','tidal-foundry','hunt-classic','double-orbit','sky-forge','rampage-3d'];
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--disable-gpu-vsync','--disable-frame-rate-limit']});const report={courses:{}};
          const merge=(a,r)=>{a.impacts+=r.impacts;a.recover+=r.recover;a.auto+=r.auto;a.walls+=r.walls;a.maxY=Math.max(a.maxY,r.player.maxY);a.minY=Math.min(a.minY,r.player.minY);a.maxSpeed=Math.max(a.maxSpeed,r.player.maxSpeed);a.minUp=Math.min(a.minUp,r.player.minUp);a.maxAir=Math.max(a.maxAir,r.player.maxAir);};
          for(const id of courses){const page=await browser.newPage({viewport:{width:852,height:393},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_0 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});const logs=[];page.on('console',m=>logs.push(`${m.type()}: ${m.text()}`));page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));await page.goto(`http://127.0.0.1:4173/?course=${id}`,{waitUntil:'networkidle'});await page.waitForFunction(()=>window.__nineCourseReview);const initial=await page.evaluate(()=>window.__nineCourseReview.state());let state=await page.evaluate(m=>m==='racing'?window.__nineCourseReview.startSolo():window.__nineCourseReview.startArena(),initial.mode);await page.waitForTimeout(350);await page.screenshot({path:`${id}-00-start.png`});const agg={impacts:0,recover:0,auto:0,walls:0,maxY:-999,minY:999,maxSpeed:0,minUp:1,maxAir:0};
            if(state.mode!=='racing'){for(let chunk=0;chunk<48;chunk++){const r=await page.evaluate(()=>window.__nineCourseReview.tick(30));state=r;merge(agg,r);if([15,31,47].includes(chunk)){await page.waitForTimeout(180);await page.screenshot({path:`${id}-${chunk===15?'08':chunk===31?'16':'24'}s.png`});}}report.courses[id]={final:state,agg,cars:await page.evaluate(()=>window.__nineCourseReview.cars()),logs,viewport:await page.evaluate(()=>({scale:visualViewport?.scale,offsetLeft:visualViewport?.offsetLeft,offsetTop:visualViewport?.offsetTop,scrollX,scrollY,innerWidth,innerHeight}))};}
            else{const spec=await page.evaluate(()=>window.__nineCourseReview.spec()),startDistance=state.raceDistance,target=startDistance+spec.length*.97;let frames=0,prevLoop=-2;const seen={loops:[],crowns:[],bridge:false,jumpAir:false,jumpLand:false,exitStabilizer:false};const snap=async name=>{await page.waitForTimeout(220);await page.screenshot({path:`${id}-${name}.png`});};while(frames<3600&&!state.playerDead&&state.raceDistance<target){const r=await page.evaluate(()=>window.__nineCourseReview.tick(12));state=r;frames+=12;merge(agg,r);if(state.kind==='loop'&&state.loopIndex!==prevLoop){prevLoop=state.loopIndex;seen.loops.push(state.loopIndex);await snap(`loop${state.loopIndex+1}-entry`);}if(state.kind==='loop'&&state.upY<-.70&&!seen.crowns.includes(state.loopIndex)){seen.crowns.push(state.loopIndex);await snap(`loop${state.loopIndex+1}-crown`);}if(state.exitStabilizer&&!seen.exitStabilizer){seen.exitStabilizer=true;await snap('exit-stabilizer');}if(state.kind==='bridge'&&!seen.bridge){seen.bridge=true;await snap('bridge');}if((state.kind==='jump-gap'||state.air>.12)&&!seen.jumpAir){seen.jumpAir=true;await snap('jump-air');}if(state.kind==='jump-landing'&&!seen.jumpLand){seen.jumpLand=true;await snap('jump-land');}}await snap('solo-end');const solo={final:state,agg,frames,simSeconds:frames/60,startDistance,target,seen};
              state=await page.evaluate(()=>window.__nineCourseReview.startPack());const packAgg={impacts:0,recover:0,auto:0,walls:0,maxY:-999,minY:999,maxSpeed:0,minUp:1,maxAir:0};for(let i=0;i<60;i++){const r=await page.evaluate(()=>window.__nineCourseReview.tick(30));merge(packAgg,r);}await page.waitForTimeout(350);await page.screenshot({path:`${id}-99-pack30s.png`});const cars=await page.evaluate(()=>window.__nineCourseReview.cars()),stalled=cars.filter(c=>!c.dead&&c.speed<1.2).length,advanced=cars.filter(c=>c.raceDistance>spec.length*.45).length;report.courses[id]={spec,solo,pack:{final:await page.evaluate(()=>window.__nineCourseReview.state()),agg:packAgg,cars,stalled,advanced},logs,viewport:await page.evaluate(()=>({scale:visualViewport?.scale,offsetLeft:visualViewport?.offsetLeft,offsetTop:visualViewport?.offsetTop,scrollX,scrollY,innerWidth,innerHeight}))};}
            await page.close();}
          fs.writeFileSync('nine-course-report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));await browser.close();
          EOF
          node review9.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nine-course-final-browser-review
          path: |
            *.png
            nine-course-report.json
