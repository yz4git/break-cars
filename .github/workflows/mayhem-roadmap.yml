name: MAYHEM TOUR roadmap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build generated game
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Check generated game
        run: node --check _site/game.js
      - name: Test MAYHEM roadmap
        run: |
          node scripts/test-mayhem-roadmap.mjs
          node scripts/test-mayhem-recap-v814.mjs
          node scripts/test-mayhem-recap-v815.mjs
