name: Full mode visual review audit

on:
  push:
    branches: [main]
    paths:
      - '.github/mode-review-audit.mjs'
      - '.github/workflows/mode-review-audit.yml'
      - 'dist/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Prepare exact game build
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve generated game
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/break-cars-mode-review-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/break-cars-mode-review-http.log
          exit 1
      - name: Drive and capture all mode variants
        env:
          BREAK_CARS_AUDIT_URL: http://127.0.0.1:4173/
        run: node .github/mode-review-audit.mjs
      - name: Upload mode review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: break-cars-mode-review-${{ github.sha }}
          path: artifacts/mode-review-audit
          if-no-files-found: error
          retention-days: 7
