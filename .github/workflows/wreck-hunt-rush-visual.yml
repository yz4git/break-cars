name: Wreck Hunt Rush Visual
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install chromium --with-deps
      - name: Prepare production build
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Render Wreck Rush
        run: |
          cat > review.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          const server=spawn('python3',['-m','http.server','4173','--directory','_site'],{stdio:'ignore'});
          await new Promise(r=>setTimeout(r,900));
          const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--disable-gpu-vsync','--disable-frame-rate-limit']});
          const context=await browser.newContext({viewport:{width:852,height:393},deviceScaleFactor:1,isMobile:true,hasTouch:true,userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 26_6 like Mac OS X) AppleWebKit/605.1.15 Version/26.0 Mobile/15E148 Safari/604.1'});
          const page=await context.newPage();const logs=[];page.on('console',m=>logs.push(`console ${m.type()}: ${m.text()}`));page.on('pageerror',e=>logs.push(`pageerror: ${e.message}`));
          await page.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});await page.click('button[data-mode="wreck-hunt"]');await page.click('#start');await page.waitForTimeout(3900);await page.keyboard.down('ArrowUp');
          const read=()=>page.evaluate(()=>{const a=document.querySelector('#hunt-nav b'),m=(a?.style.transform||'').match(/rotate\(([-0-9.]+)rad\)/);return{bearing:m?Number(m[1]):0,wrecks:parseInt(document.querySelector('#alive')?.textContent||'0',10)||0,score:document.querySelector('#score')?.textContent?.trim(),chain:document.querySelector('#hunt-info')?.innerText?.trim(),nav:document.querySelector('#hunt-nav')?.innerText?.trim(),speed:document.querySelector('#speed')?.innerText?.trim(),hull:document.querySelector('#hp')?.textContent?.trim(),rush:document.body.classList.contains('hunt-rush'),viewport:{scale:visualViewport?.scale,offsetLeft:visualViewport?.offsetLeft,offsetTop:visualViewport?.offsetTop,scrollX,scrollY}}});
          const samples=[];let first=false,second=false;
          for(let i=0;i<110;i++){
            const before=await read();const key=Math.abs(before.bearing)<.10?null:(before.bearing>0?'ArrowLeft':'ArrowRight');if(key)await page.keyboard.down(key);await page.waitForTimeout(140);if(key)await page.keyboard.up(key);const s=await read();samples.push({i,...s});
            if(s.rush&&!first){first=true;await page.screenshot({path:'01-wreck-rush.png'});}
            if(first&&!second&&i%4===0&&s.rush){await page.screenshot({path:'02-rush-chase.png'});second=true;}
            if(s.wrecks>=2){await page.screenshot({path:'03-chain-wreck.png'});break;}
          }
          await page.keyboard.up('ArrowUp');await page.waitForTimeout(350);await page.screenshot({path:'04-final.png'});const report=await read();fs.writeFileSync('report.json',JSON.stringify({report,samples,logs},null,2));await browser.close();server.kill('SIGTERM');
          EOF
          node review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: break-cars-wreck-hunt-rush-review
          path: |
            *.png
            report.json
