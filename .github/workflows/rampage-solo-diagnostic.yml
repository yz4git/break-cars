name: RAMPAGE solo diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare game
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 scripts/prepare-pages.py
      - name: Trace RAMPAGE auto recovery
        run: |
          cat > /tmp/rampage-diag.mjs <<'EOF'
          globalThis.location={search:'?course=rampage-3d'};
          const physics=await import(`${process.cwd()}/_site/physics.js?d=${Date.now()}`);
          const p3=await import(`${process.cwd()}/_site/physics3d.js?d=${Date.now()}`);
          const racing=await import(`${process.cwd()}/_site/racing.js?d=${Date.now()}`);
          const {makeWorld,step}=physics;const {samplePhysicsSurface}=p3;const {trackPoint,LENGTH}=racing;
          const w=makeWorld(0,2468,'racing');w.done=false;w.endAt=999;w.limit=999;
          for(const c of w.cars.slice(1)){c.finished=true;c.dead=false;c.vx=c.vz=0;}
          const c=w.cars[0],bodyUp=b=>({x:2*(b.qx*b.qy-b.qz*b.qw),y:1-2*(b.qx*b.qx+b.qz*b.qz),z:2*(b.qy*b.qz+b.qx*b.qw)});
          let firstTimer=null,auto=null,maxTimer=0,maxAir=0;const trace=[];
          for(let frame=0;frame<2200&&!w.done&&c.raceDistance<LENGTH*.985;frame++){
            step(w,{},1/60,true);const b=c.p3;if(!b)continue;const up=bodyUp(b),surface=samplePhysicsSurface('racing',b.px,b.py,b.pz,up,true,c.trackS),road=trackPoint(c.trackS||0),align=surface?up.x*surface.normal.x+up.y*surface.normal.y+up.z*surface.normal.z:999,speed=Math.hypot(b.vx,b.vy,b.vz);
            maxTimer=Math.max(maxTimer,c.autoUprightTime||0);maxAir=Math.max(maxAir,b.airTime||0);
            const snap={frame,time:+w.time.toFixed(3),trackS:+c.trackS.toFixed(3),raceDistance:+c.raceDistance.toFixed(3),kind:road.kind,speed:+speed.toFixed(3),upY:+up.y.toFixed(3),align:+align.toFixed(3),wheels:b.groundedWheels,air:+(b.airTime||0).toFixed(3),timer:+(c.autoUprightTime||0).toFixed(3),y:+b.py.toFixed(3),surface:surface?.kind,d:+(surface?.d??999).toFixed(3),boost:!!c.rampageBoost};
            if(!firstTimer&&(c.autoUprightTime||0)>.15)firstTimer=snap;
            for(const e of w.events)if(e.type==='auto-upright'&&!auto)auto={...snap,event:e};
            if((c.autoUprightTime||0)>.05||speed<2||road.kind==='jump-gap'||road.kind==='jump-landing'||road.kind==='loop')trace.push(snap);
          }
          console.log(JSON.stringify({length:LENGTH,final:{time:w.time,trackS:c.trackS,raceDistance:c.raceDistance,speed:Math.hypot(c.p3.vx,c.p3.vy,c.p3.vz),dead:c.dead},firstTimer,auto,maxTimer,maxAir,trace:trace.slice(-180)},null,2));
          EOF
          node /tmp/rampage-diag.mjs
